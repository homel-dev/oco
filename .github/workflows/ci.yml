name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organization-standards:
    name: Organization standards
    uses: homel-dev/.github/.github/workflows/repository-ci.yml@047391f1ac3e79ce2a9c1c74ebb1f4dfc261d8c6
    with:
      standards_ref: 047391f1ac3e79ce2a9c1c74ebb1f4dfc261d8c6
      enforce_numbered_docs: true

  oco-manifests:
    name: OCO manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check "yamllint==1.38.0"

      - name: Install kubectl v1.37.0
        shell: bash
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Render Kustomize targets
        shell: bash
        run: |
          mkdir -p .ci/rendered
          kubectl kustomize k8s > .ci/rendered/console.yaml
          kubectl kustomize k8s/backend > .ci/rendered/backend.yaml
          kubectl kustomize k8s/backend/overlays/tempo-minio > .ci/rendered/backend-minio.yaml

      - name: Validate OCO invariants
        run: python scripts/ci/validate_oco.py --rendered-dir .ci/rendered

      - name: Kubernetes schema validation
        shell: bash
        run: |
          image='ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e'
          for manifest in .ci/rendered/*.yaml; do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${image}" \
              -strict \
              -summary \
              -kubernetes-version 1.37.0 \
              "/work/${manifest}"
          done
