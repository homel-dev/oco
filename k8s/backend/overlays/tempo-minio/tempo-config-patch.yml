apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    backend_worker:
      compaction:
        block_retention: 168h

    storage:
      trace:
        backend: s3
        wal:
          path: /var/tempo/wal
        s3:
          bucket: observability-tempo
          endpoint: minio.host-runtime.svc.cluster.local:9000
          access_key: ${TEMPO_S3_ACCESS_KEY}
          secret_key: ${TEMPO_S3_SECRET_KEY}
          insecure: true

    usage_report:
      reporting_enabled: false
