# k8s/grafana/configmap-frontend.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-frontend
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {}

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      server {
        listen 8080;

        location = /_grafana_auth {
          internal;
          proxy_pass http://127.0.0.1:3000/api/user;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header X-Original-URI $request_uri;
        }

        location @grafana_login {
          return 302 /login;
        }

        location /artifacts/ {
          auth_request /_grafana_auth;
          error_page 401 = @grafana_login;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_pass http://127.0.0.1:8081;
        }

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_pass http://127.0.0.1:3000;
        }
      }
    }
  artifact-proxy.mjs: |
    import { createHash, createHmac } from "node:crypto";
    import { createServer, request as httpRequest } from "node:http";
    import { request as httpsRequest } from "node:https";

    const endpoint = new URL(process.env.OCO_ARTIFACT_STORE_ENDPOINT ?? "");
    const bucket = process.env.OCO_ARTIFACT_STORE_BUCKET ?? "";
    const accessKey = process.env.OCO_ARTIFACT_STORE_ACCESS_KEY ?? "";
    const secretKey = process.env.OCO_ARTIFACT_STORE_SECRET_KEY ?? "";
    const port = Number(process.env.OCO_ARTIFACT_PROXY_PORT ?? "8081");
    const region = "us-east-1";
    const service = "s3";

    if (!/^https?:$/.test(endpoint.protocol) || endpoint.pathname !== "/" || !bucket || !accessKey || !secretKey) {
      throw new Error("OCO artifact-store configuration is invalid");
    }
    if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error("OCO_ARTIFACT_PROXY_PORT is invalid");

    const sha256 = (value) => createHash("sha256").update(value).digest("hex");
    const hmac = (key, value) => createHmac("sha256", key).update(value).digest();
    const awsEncode = (value) => encodeURIComponent(value).replace(/[!'()*]/g, (ch) => `%${ch.charCodeAt(0).toString(16).toUpperCase()}`);
    const canonicalPath = (key) => `/${awsEncode(bucket)}/${key.split("/").map(awsEncode).join("/")}`;
    const amzTimestamp = (date) => date.toISOString().replace(/[:-]|\.\d{3}/g, "");

    function authorization(method, path, now) {
      const amzDate = amzTimestamp(now);
      const date = amzDate.slice(0, 8);
      const payloadHash = sha256("");
      const signedHeaders = "host;x-amz-content-sha256;x-amz-date";
      const canonicalHeaders = `host:${endpoint.host}\nx-amz-content-sha256:${payloadHash}\nx-amz-date:${amzDate}\n`;
      const canonicalRequest = `${method}\n${path}\n\n${canonicalHeaders}\n${signedHeaders}\n${payloadHash}`;
      const scope = `${date}/${region}/${service}/aws4_request`;
      const stringToSign = `AWS4-HMAC-SHA256\n${amzDate}\n${scope}\n${sha256(canonicalRequest)}`;
      const kDate = hmac(Buffer.from(`AWS4${secretKey}`, "utf8"), date);
      const kRegion = hmac(kDate, region);
      const kService = hmac(kRegion, service);
      const kSigning = hmac(kService, "aws4_request");
      const signature = createHmac("sha256", kSigning).update(stringToSign).digest("hex");
      return {
        authorization: `AWS4-HMAC-SHA256 Credential=${accessKey}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`,
        amzDate,
        payloadHash,
      };
    }

    function send(res, status, message) {
      const body = Buffer.from(`${message}\n`);
      res.writeHead(status, { "content-type": "text/plain; charset=utf-8", "content-length": String(body.length), "cache-control": "no-store" });
      res.end(body);
    }

    createServer((req, res) => {
      if (req.url === "/healthz") { send(res, 200, "ok"); return; }
      const method = req.method ?? "GET";
      if (method !== "GET" && method !== "HEAD") { send(res, 405, "method not allowed"); return; }
      let url;
      try { url = new URL(req.url ?? "/", "http://localhost"); } catch { send(res, 400, "invalid URL"); return; }
      if (url.search) { send(res, 400, "query parameters are not supported"); return; }
      if (!url.pathname.startsWith("/artifacts/runs/")) { send(res, 404, "artifact not found"); return; }
      let key;
      try { key = decodeURIComponent(url.pathname.slice("/artifacts/".length)); } catch { send(res, 400, "invalid artifact path"); return; }
      if (!key.startsWith("runs/") || key.includes("\\") || key.includes("\0") || key.split("/").some((segment) => segment === "..")) {
        send(res, 400, "invalid artifact path"); return;
      }

      const path = canonicalPath(key);
      const signed = authorization(method, path, new Date());
      const requester = endpoint.protocol === "https:" ? httpsRequest : httpRequest;
      const upstream = requester({
        protocol: endpoint.protocol,
        hostname: endpoint.hostname,
        port: endpoint.port || (endpoint.protocol === "https:" ? 443 : 80),
        method,
        path,
        headers: {
          host: endpoint.host,
          authorization: signed.authorization,
          "x-amz-date": signed.amzDate,
          "x-amz-content-sha256": signed.payloadHash,
        },
        timeout: 30_000,
      }, (upstreamRes) => {
        const headers = {};
        for (const name of ["content-type", "content-length", "content-disposition", "etag", "last-modified", "cache-control", "accept-ranges"]) {
          const value = upstreamRes.headers[name];
          if (value !== undefined) headers[name] = value;
        }
        res.writeHead(upstreamRes.statusCode ?? 502, headers);
        upstreamRes.pipe(res);
      });
      upstream.on("timeout", () => upstream.destroy(new Error("MinIO request timed out")));
      upstream.on("error", (error) => { if (!res.headersSent) send(res, 502, "artifact backend unavailable"); else res.destroy(error); });
      upstream.end();
    }).listen(port, "127.0.0.1");
