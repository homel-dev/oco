apiVersion: v1
kind: ConfigMap
metadata:
  name: oco-rr-live-run-dashboard
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: homel-observability
data:
  rr-live-run.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Live RR execution dashboard backed by OCO VictoriaLogs/VictoriaMetrics plus Memory Steward Postgres. RR panels read the rr namespace already tailed by central Alloy; runtime panels read actual llm-runtime gateway/MCP metrics; memory panels read canonical telemetry tables.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "AI Runtime \u00b7 Operations",
          "type": "link",
          "url": "/d/oco-ai-runtime-operations/ai-runtime-operations",
          "targetBlank": false
        },
        {
          "title": "Memory Steward \u00b7 Overview",
          "type": "link",
          "url": "/d/ms-overview/memory-steward-overview",
          "targetBlank": false
        }
      ],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "RR events",
          "description": "Structured RR events in the selected time range and run filter.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "editorMode": "code",
              "expr": "{namespace=\"rr\"} AND runId:$run_id AND event_type:* | stats count() as value",
              "queryType": "stats",
              "refId": "A",
              "maxLines": 500
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "RR failures",
          "description": "RR events marked failed or error.",
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "editorMode": "code",
              "expr": "{namespace=\"rr\"} AND runId:$run_id AND (status:=\"failed\" OR detected_level:=\"error\") | stats count() as value",
              "queryType": "stats",
              "refId": "A",
              "maxLines": 500
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "LLM req/s",
          "description": "Shared llm-runtime gateway request throughput.",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "LLM p95",
          "description": "Shared llm-runtime gateway p95 upstream duration.",
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              },
              "unit": "s",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_gateway_request_duration_seconds_bucket{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval])))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Gateway error %",
          "description": "5xx plus transport failures over all completed/failed upstream requests.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "percent",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "100 * ((sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\",status_code=~\"5..\"}[$__rate_interval])) + sum(rate(llm_gateway_upstream_errors_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval]))) / clamp_min(sum(rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval])) + sum(rate(llm_gateway_upstream_errors_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval])), 0.000001))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "MCP req/s",
          "description": "Envoy MCP gateway downstream request rate.",
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(rate(envoy_http_downstream_rq_total{project=\"llm-runtime\",job=\"mcp-envoy\"}[$__rate_interval]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "MS requests \u00b7 5m",
          "description": "Memory Steward router requests for the selected project(s).",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "postgres",
            "uid": "memory-steward-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "memory-steward-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*)::bigint AS value FROM telemetry.request WHERE t_begin >= now()-interval '5 minutes' AND ('__all' IN (${project:sqlstring}) OR project_id IN (${project:sqlstring}))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "MS zero-result %",
          "description": "Memory retrievals that returned zero selected chunks.",
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "postgres",
            "uid": "memory-steward-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              },
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "memory-steward-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COALESCE(100.0*count(*) FILTER(WHERE x.selected_topk=0)/NULLIF(count(*),0),0) AS value FROM telemetry.retrieval x JOIN telemetry.request r USING(request_id) WHERE $__timeFilter(r.t_begin) AND ('__all' IN (${project:sqlstring}) OR r.project_id IN (${project:sqlstring}))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "RR event stream",
          "description": "Live structured RR event rate grouped by event type.",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 9,
            "h": 6
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 22,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 3,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc",
              "hideZeros": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "editorMode": "code",
              "expr": "{namespace=\"rr\"} AND runId:$run_id AND event_type:* | stats by (event_type) count() as events",
              "queryType": "statsRange",
              "refId": "A",
              "maxLines": 500,
              "legendFormat": "{{event_type}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "LLM gateway \u00b7 requests by model",
          "description": "Shared gateway traffic; model/backend filters apply.",
          "gridPos": {
            "x": 9,
            "y": 3,
            "w": 9,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 18,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 3,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc",
              "hideZeros": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (model) (rate(llm_gateway_upstream_requests_total{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{model}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "Runtime health",
          "description": "Observed health from VictoriaMetrics. Any missing series remains visible as no data.",
          "gridPos": {
            "x": 18,
            "y": 3,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "max(up{project=\"llm-runtime\",job=\"alloy\"})",
              "refId": "A",
              "legendFormat": "Alloy"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "max(up{project=\"llm-runtime\",job=\"llm-gateway\"})",
              "refId": "B",
              "legendFormat": "LLM Gateway"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "max(probe_success{project=\"llm-runtime\",job=\"omniroute-blackbox\"})",
              "refId": "C",
              "legendFormat": "OmniRoute"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "max(up{project=\"llm-runtime\",job=\"mcp-envoy\"})",
              "refId": "D",
              "legendFormat": "MCP Gateway"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "min(up{project=\"llm-runtime\",component=\"inference\"})",
              "refId": "E",
              "legendFormat": "Inference"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "LLM gateway \u00b7 latency",
          "description": "Native gateway end-to-end upstream request duration.",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 3,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc",
              "hideZeros": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(llm_gateway_request_duration_seconds_bucket{project=\"llm-runtime\",backend=~\"$backend\",model=~\"$model\"}[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "p50"
            },
