apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: artifact-proxy
          image: node:24-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/oco/artifact-proxy.mjs"]
          envFrom:
            - secretRef:
                name: oco-artifact-store
          ports:
            - name: artifacts
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: artifacts
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: artifacts
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: frontend-config
              mountPath: /opt/oco/artifact-proxy.mjs
              subPath: artifact-proxy.mjs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: frontend
          image: nginx:1.29.1-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
          ports:
            - name: frontend
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: frontend
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: frontend
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: frontend-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: frontend-config
          configMap:
            name: grafana-frontend
        - name: frontend-tmp
          emptyDir:
            sizeLimit: 64Mi
