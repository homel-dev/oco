# k8s/grafana/deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: presentation
    spec:
      serviceAccountName: observability-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0   # placeholder — pin to a current verified release
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PLUGINS_PREINSTALL
              value: victoriametrics-logs-datasource@0.31.0
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: oco-dashboard
              mountPath: /var/lib/grafana/oco
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: sidecar-datasources
          image: kiwigrid/k8s-sidecar:1.28.0   # placeholder — verify current tag
          env:
            - name: METHOD
              value: WATCH
            - name: RESOURCE
              value: configmap
            - name: LABEL
              value: grafana_datasource
            - name: LABEL_VALUE
              value: "1"
            - name: FOLDER
              value: /etc/grafana/provisioning/datasources
            - name: NAMESPACE
              value: observability-console,llm-runtime,host-runtime,rr,ms    # watched-namespace set — append each onboarded consumer
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
        - name: sidecar-dashboards
          image: kiwigrid/k8s-sidecar:1.28.0
          env:
            - name: METHOD
              value: WATCH
            - name: RESOURCE
              value: configmap
            - name: LABEL
              value: grafana_dashboard
            - name: LABEL_VALUE
              value: "1"
            - name: FOLDER
              value: /var/lib/grafana/dashboards
            - name: NAMESPACE
              value: observability-console,llm-runtime,host-runtime,rr,ms
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          emptyDir: {}
        - name: dashboards
          emptyDir: {}
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: oco-dashboard
          configMap:
            name: oco-dashboard
