# k8s/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability-console

resources:
  - namespace.yml
  - serviceaccount.yml
  - grafana/secret.yml
  - grafana/configmap-dashboard-provider.yml
  - grafana/configmap-frontend.yml
  - grafana/deployment.yml
  - grafana/service.yml

patchesStrategicMerge:
  - grafana/deployment-artifacts.patch.yml
  - grafana/service-artifacts.patch.yml
